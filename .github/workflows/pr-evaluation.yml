name: PR evaluation

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read

concurrency:
  group: pr-evaluation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  evaluation:
    name: PR evaluation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CI: 'true'
      EVALUATION_BASE: ${{ github.event.pull_request.base.sha }}
    steps:
      - name: Check out proposed merge
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Execute required and task-specific checks with traces
        run: npm run ci:checks
      - name: Validate every change and source-bound evidence
        run: npm run ci:gate
      - name: Save evaluation evidence and diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pr-evaluation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            reports/
            evals/changes/
          if-no-files-found: error
          retention-days: 7
